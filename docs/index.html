<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#FFD600;--danger:#FF005C;--black:#000;--white:#FFF;--shadow:4px 4px 0px 0px #000;--shadow-sm:2px 2px 0px 0px #000}
body{font-family:system-ui,-apple-system,sans-serif;background:#F9FAFB;color:#000;min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:16px}

/* Cards */
.card{background:var(--white);border:2px solid var(--black);box-shadow:var(--shadow);padding:24px;margin-bottom:16px}
.card-pink{background:#FCE7F3}.card-green{background:#DCFCE7}.card-red{background:#FEE2E2}
.card-yellow{background:#FEF9C3}.card-blue{background:#DBEAFE}.card-purple{background:#F3E8FF}
.card-indigo{background:#E0E7FF}.card-orange{background:#FFEDD5}.card-cyan{background:#CFFAFE}
.card-amber{background:#FEF3C7}.card-rose{background:#FFE4E6}

/* Buttons */
.btn{font-weight:700;border:2px solid var(--black);box-shadow:var(--shadow);padding:10px 24px;cursor:pointer;transition:all .1s;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--black)}
.btn-primary:hover{background:#FACC15}
.btn-outline{background:var(--white);color:var(--black)}
.btn-outline:hover{background:#F3F4F6}
.btn-row{display:flex;gap:12px}
.btn-row .btn{flex:1}

/* Typography */
h1{font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:-1px}
h2{font-size:20px;font-weight:900;text-transform:uppercase}
h3{font-size:16px;font-weight:900;text-transform:uppercase}
.subtitle{font-size:14px;color:#374151;font-weight:500}
.text-xs{font-size:12px}.text-sm{font-size:14px}
.text-center{text-align:center}
.font-bold{font-weight:700}
.uppercase{text-transform:uppercase}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.space-y>*+*{margin-top:16px}

/* Header */
.header{background:var(--white);border-bottom:2px solid var(--black);padding:16px;position:sticky;top:0;z-index:10;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.header-inner{max-width:480px;margin:0 auto}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

/* Progress bar */
.progress{height:12px;background:var(--white);border:2px solid var(--black)}
.progress-fill{height:100%;background:var(--primary);transition:width .3s}

/* Options */
.option-btn{width:100%;text-align:left;padding:12px 16px;border:2px solid var(--black);font-weight:700;transition:all .1s;cursor:pointer;display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;background:var(--white);box-shadow:var(--shadow)}
.option-btn:hover{background:#F9FAFB}
.option-btn:active{transform:translate(2px,2px);box-shadow:none}
.option-btn.selected{background:var(--primary);box-shadow:var(--shadow-sm);transform:translate(-2px,-2px)}
.option-letter{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid var(--black);font-weight:900;font-size:14px;flex-shrink:0;background:var(--white)}
.option-btn.selected .option-letter{background:var(--black);color:var(--white)}
.option-text{font-size:14px;padding-top:4px}

/* Group header */
.group-header{padding:12px;border:2px solid var(--black);box-shadow:var(--shadow)}
.group-header-top{display:flex;justify-content:space-between;align-items:center}
.group-badge{font-size:12px;font-weight:700;background:var(--white);border:2px solid var(--black);padding:2px 8px}
.phase-badge{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;background:var(--black);color:var(--white);padding:2px 8px;text-transform:uppercase}

/* Score bar */
.score-bar-wrap{margin-bottom:8px}
.score-bar-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px}
.score-bar{height:16px;background:var(--white);border:2px solid var(--black)}
.score-bar-fill{height:100%;transition:width .5s}
.fill-green{background:#4ADE80}.fill-blue{background:#60A5FA}.fill-yellow{background:#FACC15}.fill-red{background:#F87171}.fill-gray{background:#9CA3AF}

/* Badge */
.badge{display:inline-block;padding:2px 8px;font-size:12px;font-weight:700;border:2px solid var(--black)}
.badge-green{background:#BBF7D0}.badge-blue{background:#BFDBFE}.badge-yellow{background:#FEF08A}.badge-red{background:#FECACA}

/* Feedback */
.feedback-item{display:flex;gap:8px;font-size:14px;margin-bottom:8px}
.feedback-item span:first-child{flex-shrink:0}
.feedback-item .italic{font-style:italic;color:#6B7280}

/* Style breakdown */
.style-bar{margin-bottom:6px}
.style-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:2px}
.style-track{height:12px;background:var(--white);border:2px solid var(--black)}
.style-fill{height:100%;transition:width .5s}

/* Tabs */
.tabs{display:flex;border:2px solid var(--black);box-shadow:var(--shadow);margin-bottom:16px}
.tab{flex:1;padding:12px;font-weight:700;font-size:14px;text-transform:uppercase;text-align:center;cursor:pointer;border:none;transition:background .15s}
.tab:first-child{border-right:2px solid var(--black)}
.tab.active{background:var(--primary);color:var(--black)}
.tab:not(.active){background:var(--white);color:#9CA3AF}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-item{padding:12px;border:2px solid var(--black);font-weight:700;font-size:12px;text-transform:uppercase}

/* Introspection */
.intro-prompt{display:flex;gap:8px;font-size:14px;color:#6B7280;margin-bottom:4px}
.intro-dot{color:#A855F7;flex-shrink:0}

/* Transition */
.transition-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}

/* Couple input */
.couple-input-section{margin-top:16px}
.couple-input-section label{font-weight:700;font-size:14px;display:block;margin-bottom:8px}
.couple-input{width:100%;padding:12px;border:2px solid var(--black);font-size:16px;font-weight:700;font-family:monospace;text-align:center;margin-bottom:12px}

/* Share section */
.share-code{font-size:28px;font-weight:900;letter-spacing:4px;background:var(--white);border:2px solid var(--black);padding:8px 16px;display:inline-block;cursor:pointer;user-select:all}
.share-hint{font-size:12px;color:#6B7280;margin-top:8px}

/* Hidden */
.hidden{display:none}
</style>
</head>

// ==================== SCORING ====================

function calcDimensionScores(answers) {
    const scores = {};
    for (const dim of DIMENSIONS) {
        const qs = QUESTIONS.filter(q => q.construct === dim.id);
        let total = 0, count = 0;
        for (const q of qs) {
            const raw = answers[q.id];
            if (raw == null) continue;
            total += q.reverse ? (6 - raw) : raw;
            count++;
        }
        scores[dim.id] = count > 0 ? Math.round((total / count) * 100) / 100 : 0;
    }
    return scores;
}

function calcPatternScores(scenarioAnswers) {
    const scores = {};
    for (const p of SCENARIO_PATTERNS) {
        const ss = SCENARIOS.filter(s => s.pattern === p.id);
        let total = 0, count = 0;
        for (const s of ss) {
            const chosen = scenarioAnswers[s.id];
            if (!chosen) continue;
            const opt = s.options.find(o => o.style === chosen);
            if (opt) { total += opt.score; count++; }
        }
        scores[p.id] = count > 0 ? Math.round((total / count) * 100) / 100 : 0;
    }
    return scores;
}

function calcDominantStyle(scenarioAnswers) {
    const b = { secure:0, anxious:0, avoidant:0, reactive:0 };
    for (const style of Object.values(scenarioAnswers)) {
        if (b[style] !== undefined) b[style]++;
    }
    const dominant = Object.entries(b).sort((a,c) => c[1] - a[1])[0][0];
    return { dominant, breakdown: b };
}

function getDimLevel(score) { return score >= 4.0 ? "high" : score >= 2.5 ? "medium" : "low"; }
function getPatLevel(score) { return score >= 3.5 ? "high" : score >= 2.0 ? "medium" : "low"; }

function getDimInterp(score) {
    if (score >= 4.0) return { level:"Fortaleza", color:"green" };
    if (score >= 3.0) return { level:"Saludable", color:"blue" };
    if (score >= 2.0) return { level:"Oportunidad", color:"yellow" };
    return { level:"Atención", color:"red" };
}

function getPatInterp(score) {
    if (score >= 3.5) return { level:"Seguro", color:"green" };
    if (score >= 2.5) return { level:"Moderado", color:"blue" };
    if (score >= 1.5) return { level:"Atención", color:"yellow" };
    return { level:"Alerta", color:"red" };
}

}

function renderIntrospection(patScores) {
    const sorted = Object.entries(patScores).sort((a,b) => a[1] - b[1]).slice(0, 3);
    if (sorted.length === 0) return '';
    return `
    <div class="card card-purple">
        <h3>Para Reflexionar</h3>
        <p class="text-xs mb-4" style="color:#6B7280">Preguntas para explorar tus patrones de reacción más activos.</p>
        ${sorted.map(([pid, score]) => {
            const p = SCENARIO_PATTERNS.find(x => x.id === pid);
            const prompts = INTROSPECTION[pid];
            if (!p || !prompts) return '';
            return `
            <div class="mb-4">
                <p class="font-bold text-sm mb-2">${p.name} <span style="color:#6B7280;font-weight:400">(${score.toFixed(1)}/4.0)</span></p>
                ${prompts.map(pr => `<div class="intro-prompt"><span class="intro-dot">•</span><span>${pr}</span></div>`).join("")}
            </div>`;
        }).join("")}
    </div>`;
}

// ==================== ACTIONS ====================

function startTest() {
    const input = document.getElementById("nameInput");
    state.userName = input ? input.value.trim() : "";
    state.likertAnswers = {};
    state.scenarioAnswers = {};
    state.currentGroupIndex = 0;
    state.screen = "likert";
    render();
    window.scrollTo(0, 0);
}

function goIntro() {
    state.screen = "intro";
    render();
    window.scrollTo(0, 0);
}

function answerLikert(qId, val) {
    state.likertAnswers[qId] = val;
    render();
}

function answerScenario(sId, style) {
    state.scenarioAnswers[sId] = style;
    render();
}

function nextGroup() {
    state.currentGroupIndex++;
    render();
    window.scrollTo(0, 0);
}

function prevGroup() {
    if (state.currentGroupIndex > 0) {
        state.currentGroupIndex--;
        render();
        window.scrollTo(0, 0);
    }
}

function goTransition() {
    state.screen = "transition";
    render();
    window.scrollTo(0, 0);
}

function goScenarios() {
    state.screen = "scenarios";
    state.currentGroupIndex = 0;
    render();
    window.scrollTo(0, 0);
}

function prevScenarioGroup() {
    if (state.currentGroupIndex > 0) {
        state.currentGroupIndex--;
        render();
        window.scrollTo(0, 0);
    } else {
        state.screen = "transition";
        render();
        window.scrollTo(0, 0);
    }
}

function submitTest() {
    const unansweredL = QUESTIONS.filter(q => state.likertAnswers[q.id] == null).length;
    const unansweredS = SCENARIOS.filter(s => state.scenarioAnswers[s.id] == null).length;
    if (unansweredL + unansweredS > 0) {
        alert(`Faltan ${unansweredL + unansweredS} preguntas por responder.`);
        return;
    }
    state.screen = "results";
    render();
    window.scrollTo(0, 0);
}

function shareTest() {
    const url = window.location.href.split('?')[0];
    const text = "Haz el Test del Amor y descubre tu estilo de relación 💕";
    if (navigator.share) {
        navigator.share({ title: "Test del Amor", text, url }).catch(() => {});
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => alert("¡Link copiado!")).catch(() => {
            prompt("Copia este link:", url);
        });
    } else {
        prompt("Copia este link:", url);
    }
}

// Init
render();
</script>
